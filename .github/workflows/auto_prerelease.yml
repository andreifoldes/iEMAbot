name: Automatic pre-release

on:
  push:
    branches: [develop]

  workflow_dispatch:

env:
  DOCKER_REGISTRY: jodlidev
  DOCKER_IMAGE_NAME: esmira

jobs:
  build-and-release:
    # Upstream-only: tags from package.json and pushes to upstream's Docker Hub namespace.
    # This fork releases by hand (see the Releases page), so skip it here.
    if: github.repository == 'KL-Psychological-Methodology/ESMira-web'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build for production
        run: npm run prod

      - name: Create tag
        uses: butlerlogic/action-autotag@7421fe0300091f3ef2134f627baaad42a156de10 # 1.1.4
        id: autotag
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          strategy: package
          tag_prefix: "pre."

      - name: Zip dist folder
        run: |
          cd dist
          zip -r ../ESMira-web.zip .

      - name: Create named release
        if: ${{ steps.autotag.outputs.tagcreated == 'yes' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Pre-release version ${{ steps.autotag.outputs.version }}
          tag_name: pre.${{ steps.autotag.outputs.version}}
          prerelease: true
          generate_release_notes: true
          files: ESMira-web.zip

      - name: Set up Docker Buildx
        if: ${{ steps.autotag.outputs.tagcreated == 'yes' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: ${{ steps.autotag.outputs.tagcreated == 'yes' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        if: ${{ steps.autotag.outputs.tagcreated == 'yes' }}
        id: meta
        uses: docker/metadata-action@1ec73021df0717d8bef7700a897c064453280439
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}

      - name: Build and push Docker image
        if: ${{ steps.autotag.outputs.tagcreated == 'yes' }}
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
