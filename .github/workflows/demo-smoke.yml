name: Container demo smoke test

# Builds the fork's Docker image, starts it with the demo compose file, creates the admin account and demo study
# over the real HTTP API, then runs the curl smoke test AND a headless-browser test of both front-ends
# (participant PWA + researcher dashboard). Fully self-contained: no VPN, server or secrets needed.
# See website/docs/deployment/demo-and-verification.md.
#
# Manual only: start it from the Actions tab (Run workflow). It builds dist/ inside the runner and never commits,
# so it cannot trigger an auto-tag.

on:
  workflow_dispatch:

concurrency:
  group: demo-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install browser test dependencies
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium

      - name: Build, start, bootstrap and smoke-test the demo
        env:
          # Fail (instead of skipping) if the browser test cannot run.
          REQUIRE_UI: '1'
        run: scripts/demo/demo-up.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f scripts/demo/docker-compose.demo.yml -p esmira-demo logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: scripts/demo/demo-up.sh --down
